name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate question banks
        run: python3 scripts/validate_question_banks.py

      - name: Unit tests and clean debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
